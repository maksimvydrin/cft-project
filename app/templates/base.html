<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ЦФТ - Задачи</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; color: #333; }
        header { background-color: #2c3e50; padding: 1rem 2rem; color: white; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.2rem; font-weight: bold; }
        header a { color: #ecf0f1; text-decoration: none; margin-left: 1.5rem; font-weight: 500; }
        header a:hover { color: #3498db; }
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        h1 { color: #2c3e50; margin-top: 0; }
        h2 { color: #34495e; border-bottom: 2px solid #ecf0f1; padding-bottom: 0.5rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #2c3e50; font-weight: 600; }
        tr:hover { background-color: #fcfcfc; }
        .form-group { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
        input, select { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        input:focus, select:focus { border-color: #3498db; }
        button { background-color: #3498db; color: white; border: none; padding: 9px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: white; border: 1px solid #dcdde1; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; color: #2c3e50; font-size: 1rem; transition: 0.2s; }
        .tab-btn:hover { background: #f8f9fa; }
        .tab-btn.active { background: #3498db; color: white; border-color: #3498db; }
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header>
        <div class="logo">ЦФТ</div>
        <nav>
            <a href="/">Главная</a>
            <a href="/settings">Настройки</a>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
